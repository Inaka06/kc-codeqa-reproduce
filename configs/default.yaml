model:
  name_or_path: "Qwen/Qwen2.5-Coder-0.5B"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  task_type: "CAUSAL_LM"

training:
  seed: 42
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  gradient_accumulation_steps: 8
  per_device_train_batch_size: 8
  effective_batch_size: 64
  max_epochs: 10
  max_length: 512
  gradient_checkpointing: false
  max_grad_norm: 1.0
  save_total_limit: 2
  logging_steps: 100

evaluation:
  eval_batch_size: 16
  max_new_tokens: 32
  patience: 3
